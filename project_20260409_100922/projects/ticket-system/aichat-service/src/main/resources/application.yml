# 本地默认配置（当Nacos配置缺失时使用）
server:
  port: 8084

spring:
  config:
    import: optional:nacos:localhost:8848

# 日志配置
logging:
  level:
    com.ticket.aichat: debug
    com.ticket.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# AI配置
ai:
  enabled: true
  model-type: ollama
  fallback:
    enabled: true
    fallback-type: http-api
  ollama:
    base-url: http://localhost:11434
    chat-model: qwen2.5:7b
    embedding-model: nomic-embed-text
    temperature: 0.7
    timeout: 60
  http-api:
    base-url: https://api.openai.com/v1
    api-key: 
    model: gpt-3.5-turbo
    temperature: 0.7
    timeout: 60