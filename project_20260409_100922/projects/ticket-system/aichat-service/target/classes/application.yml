# 本地默认配置（当Nacos配置缺失时使用）
server:
  port: 8084

# 与用户服务签发 Token 的密钥一致（网关与 AuthenticationInterceptor 校验）
jwt:
  secret: ticket-system-secret-key-2024-please-change-in-production
  expiration: 604800000

spring:
  config:
    import: optional:nacos:localhost:8848

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: aichat-service-producer-group
  fail-fast: true

# 日志配置
logging:
  level:
    com.ticket.aichat: INFO
    com.ticket.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# AI配置
ai:
  enabled: true
  model-type: http-api
  fallback:
    enabled: true
    fallback-type: http-api
  ollama:
    base-url: http://192.168.48.135:11434
    chat-model: llama3.2:3b # qwen2:1.5b不支持LangChain4j中的Tools注解     # 对话模型
    embedding-model: nomic-embed-text
    temperature: 0.7
    timeout: 600
  http-api:
    base-url: https://api.cphone.vip/v1
    api-key: ${AI_API_KEY}  #写在本地环境变量
    model: gpt-3.5-turbo
    temperature: 0.7
    timeout: 600

# 知识库：FAQ 仅存 DB；向量仅来自 handbook MD
knowledge:
  base-path: knowledge-base                 # MD 手册根目录（工作目录相对路径）
  # none | reconcile_once | full_rebuild（兼容 legacy: init-on-startup=true 等价 reconcile_once）
  startup-sync-mode: reconcile_once

# FAQ 直通匹配（可走 LLM 前短路）
faq:
  match:
    enabled: true

# Chroma（生产可将 allow-in-memory-fallback 设为 false）
chroma:
  host: 192.168.48.135
  port: 8000
  collection: ticket_knowledge
  allow-in-memory-fallback: true

rag:
  retrieval-expand-multiplier: 5   # 先多取再按手册启停过滤
  filtered-cap: 40