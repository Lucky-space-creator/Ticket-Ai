# 本地默认配置（当Nacos配置缺失时使用）
server:
  port: 8084

# 与用户服务签发 Token 的密钥一致（网关与 AuthenticationInterceptor 校验）
jwt:
  secret: ticket-system-secret-key-2024-please-change-in-production
  expiration: 604800000

spring:
  config:
    import: optional:nacos:localhost:8848

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: aichat-service-producer-group
  fail-fast: true

# 日志配置
logging:
  level:
    com.ticket.aichat: INFO
    com.ticket.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# AI配置
ai:
  enabled: true
  model-type: http-api
  fallback:
    enabled: true
    fallback-type: http-api
  ollama:
    base-url: http://192.168.48.135:11434
    chat-model: llama3.2:3b
    embedding-model: nomic-embed-text
    temperature: 0.7
    timeout: 600
  http-api:
    base-url: https://api.cphone.vip/v1
    api-key: ${AI_API_KEY}
    model: gpt-3.5-turbo
    temperature: 0.7
    timeout: 600

# 知识库：FAQ 仅存 DB；向量仅来自 handbook MD
knowledge:
  base-path: knowledge-base
  startup-sync-mode: reconcile_once

# FAQ（表 knowledge_base）：先于 LLM 字面匹配短路；不涉及 Chroma/BM25
faq:
  match:
    enabled: true

# Chroma 向量集合（仅知识库 RAG 使用）；embedding 不可用且 allow=true 时降级内存库（仅限开发）
chroma:
  host: 192.168.48.135
  port: 8000
  collection: ticket_knowledge
  allow-in-memory-fallback: true

rag:
  max-results: 3
  min-score: 0.7
  retrieval-expand-multiplier: 5
  filtered-cap: 40
  hybrid:
    enabled: false
  lexical:
    top-k: 40

# 用户画像配置
user-profile:
  enabled: true
  history-limit: 50
  cache-ttl-hours: 24
  message-threshold: 20
