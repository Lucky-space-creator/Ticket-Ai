server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true

spring:
  application:
    name: ticket-system

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ticket_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

  # Jackson 配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ticket.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# JWT 配置
jwt:
  secret: ticket-system-secret-key-2024-please-change-in-production
  expiration: 604800000  # 7天（毫秒）

# 日志配置
logging:
  level:
    com.ticket: debug
    com.ticket.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"





# 智能客服相关配置

# ChromaDB 向量数据库配置
chromadb:
  host: 192.168.48.131
  port: 8000
  collection: ticket_knowledge

# AI模型配置 - 支持Ollama和OpenAI两种模式
ai:
  # 模型类型: ollama, openai, http-api
  model-type: ollama
  
  # 启用/禁用AI服务
  enabled: true
  
  # Ollama配置（当model-type=ollama时使用）
  ollama:
    base-url: http://localhost:11434
    chat-model: qwen2:7b           # 对话模型
    embedding-model: nomic-embed-text  # 向量化模型
    temperature: 0.7
    timeout: 60
    
  # OpenAI配置（当model-type=openai时使用）
  openai:
    api-key: ${OPENAI_API_KEY:sk-demo-key}
    model: gpt-3.5-turbo
    temperature: 0.7
    timeout: 60
    
  # HTTP API配置（当model-type=http-api时使用）
  http-api:
    base-url: ${AI_API_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-3.5-turbo}
    temperature: 0.7
    timeout: 60
    
  # 备用模式配置
  fallback:
    # 当首选模型失败时是否启用备用模式
    enabled: true
    # 备用模型类型（openai或http-api）
    fallback-type: http-api

# AI配置使用说明：
# 1. Ollama模式（默认）：
#    - 启动Ollama服务: ollama serve
#    - 拉取模型: ollama pull qwen2:7b
#    - 模型会自动切换到备用模式当Ollama不可用时
#
# 2. OpenAI模式：
#    - 设置环境变量: export OPENAI_API_KEY=your_key_here
#    - 或在配置中直接设置api-key
#
# 3. HTTP API模式（兼容OpenAI API的第三方服务）：
#    - 设置环境变量: 
#      export AI_API_KEY=your_api_key_here
#      export AI_API_URL=https://api.your-service.com/v1
#      export AI_MODEL=your_model_name
#    - 或直接在配置中设置base-url、api-key和model
#
# 4. 禁用AI服务：
#    - 设置: ai.enabled: false
#    - AI服务将返回固定响应

# 知识库配置
knowledge:
  base-path: ./knowledge-base     # 知识库文件目录

# RAG 检索配置
rag:
  max-results: 3                   # 检索结果数量
  min-score: 0.7                   # 最低相似度阈值
