server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
# Tomcat 线程池（处理 HTTP 请求）
# 计算公式: max_threads = CPU核心数 × (1 + 等待时间/计算时间)
#   - IO密集型: 等待时间/计算时间 ≈ 4~10，经验值 200~500
#   - CPU密集型: 等待时间/计算时间 ≈ 0，经验值 核心数×2
# 本例为IO密集型应用（数据库、Redis、AI调用），取中间值200
  tomcat:
    threads:
      max: 200          # 最大线程数（计算公式见上）
      min-spare: 10     # 最小(核心)线程数，默认10，冷启动后保持的最小热线程
    # 等待队列容量（超出max后的排队数），超出则拒绝请求(503)
    accept-count: 100

spring:
  application:
    name: ticket-system
# Spring 异步配置（用于@Async等异步任务）
# 计算公式: max_size = CPU核心数 × (1 + 阻塞时间/计算时间)
#   - 阻塞时间: AI调用、外部API等IO等待时间（可能长达10-30秒）
#   - 计算时间: 本地处理时间（通常<100ms）
#   - 阻塞/计算比 ≈ 100~300，因此需要较大线程池
# 核心线程数: 根据常驻负载设置，避免频繁创建
# 队列容量: 必须有界，否则max-size不生效，队列满后创建新线程直至max-size
  task:
    execution:
      pool:
        core-size: 16              # 核心线程数（常驻）
        max-size: 120              # 最大线程数（计算公式见上）
        queue-capacity: 200        # 队列容量（有界！）
        keep-alive: 60s            # 空闲线程存活时间
        allow-core-thread-timeout: true  # 允许核心线程超时回收
      thread-name-prefix: async-task-  # 线程名前缀（便于监控）
      shutdown:
        await-termination: true    # 优雅关闭
        await-termination-period: 60s # 优雅关闭等待时间
  # 数据源配置（使用Druid连接池）
# 连接池计算公式:
#   max-active = CPU核心数 × IO系数 × 安全系数
#     - CPU核心数: 假设8核
#     - IO系数: 1.5 (数据库操作是IO密集型)
#     - 安全系数: 1.5 (避免频繁创建销毁连接)
#     计算: 8 × 1.5 × 1.5 = 18
#   经验值: 生产环境通常设置 50~100，根据并发请求数调整
#   本例设置为100，满足中等并发需求
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ticket_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    type: com.alibaba.druid.pool.DruidDataSource  # 指定使用Druid连接池
    druid:
      # 连接池核心配置
      initial-size: 10      # 初始连接数
      min-idle: 10         # 最小空闲连接数
      max-active: 150   # 最大连接数（计算公式见上）
      max-wait: 5000       # 获取连接最大等待时间（毫秒）
      
      # 连接有效性检测
      validation-query: SELECT 1
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000  # 检查空闲连接的间隔（毫秒）
      min-evictable-idle-time-millis: 300000    # 连接最小空闲时间（毫秒）
      # 监控统计配置
      filters: stat,wall        # 启用统计、防火墙过滤器（使用默认日志）
      stat-view-servlet:
        enabled: true           # 启用StatViewServlet
        url-pattern: /druid/*   # 监控页面访问路径
        login-username: admin   # 登录用户名（生产环境需修改）
        login-password: admin   # 登录密码（生产环境需修改）
        reset-enable: false     # 禁用重置按钮
      web-stat-filter:
        enabled: true           # 启用WebStatFilter
        url-pattern: /*         # 监控所有URL
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"  # 排除静态资源
      
      # 防火墙配置（防止SQL注入）
      wall:
        enabled: true
        config:
          delete-allow: false # 禁止删除
          drop-table-allow: false # 禁止删除表

  # Jackson 配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # Redis 连接池计算公式
  # 最大连接数 = CPU核心数 × IO系数 × 安全系数
  #   - CPU核心数: 假设8核
  #   - IO系数: 1.5 (IO密集型，Redis为网络IO)
  #   - 安全系数: 1.5 (避免频繁创建销毁连接)
  #   计算: 8 × 1.5 × 1.5 = 18
  # 经验值: 生产环境通常设置 50~100，根据并发客户端数调整
  # 本例设置为64，留有余量
  data:
    redis:
      # 主从模式配置（一主二从）
      # 主节点负责写操作，从节点负责读操作（负载均衡）
      master:
        host: localhost
        port: 6379
      # 从节点列表（格式: host:port），多个用逗号分隔，例如: localhost:6381,localhost:6382
      slaves: localhost:6380,localhost:6381
      database: 0
      timeout: 10000
      lettuce:
        pool:
          max-active: 64  # 最大连接数（计算公式见上）
          max-idle: 32    # 最大空闲连接数（建议为max-active的50%）
          min-idle: 8     # 最小空闲连接数（保持一定热连接）
          max-wait: 5000ms  # 最大等待时间（5秒），避免无限等待

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ticket.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# JWT 配置
jwt:
  secret: ticket-system-secret-key-2024-please-change-in-production
  expiration: 604800000  # 7天（毫秒）

# 日志配置
logging:
  level:
    com.ticket: debug
    com.ticket.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
  file:
    path: logs
  # 使用自定义logback配置（JSON格式输出给ELK）
  config: classpath:logback-spring.xml

# 全链路追踪配置
trace:
  enabled: true
  header-name: X-Request-ID

# ELK日志采集配置
elk:
  enabled: true
  log-path: C:/Users/LENOVO/OneDrive/桌面/购票智能客服系统/project_20260409_100922/projects/ticket-system/logs
  # Elasticsearch 连接配置（供参考，应用端不直连ES，由Logstash采集）
  elasticsearch:
    host: localhost
    port: 9200
    index-prefix: ticket-system
    ai-index-prefix: ai-chat-trace
  # Logstash 配置信息（部署时需同步修改）
  logstash:
    pipeline-path: D:/ELK/Logstash/logstash-9.3.3/config/pipeline.conf





# 智能客服相关配置

# ChromaDB 向量数据库配置
chroma:
  host: 192.168.48.135
  port: 8000
  collection: ticket_knowledge

# AI模型配置 - 支持Ollama和OpenAI两种模式
ai:
  # 模型类型: ollama, openai, http-api
  model-type: http-api
  
  # 启用/禁用AI服务
  enabled: true
  
  # Ollama配置（当model-type=ollama时使用）
  ollama:
    base-url: http://192.168.48.135:11434
    chat-model: llama3.2:3b # qwen2:1.5b不支持LangChain4j中的Tools注解     # 对话模型
    embedding-model: nomic-embed-text  # 向量化模型
    temperature: 0.7
    timeout: 600    # 超时时间设置为10分钟（600秒），初始加载模型可能需要较长时间

  # HTTP API配置（当model-type=http-api时使用）
  http-api:
    base-url: https://api.cphone.vip/v1
    api-key: ${API_KEY:default-key}
    model: gpt-3.5-turbo
    temperature: 0.7
    timeout: 600    #超时时间设置，初始加载模型
    
  # 备用模式配置
  fallback:
    # 当首选模型失败时是否启用备用模式
    enabled: true
    # 备用模型类型（http-api）
    fallback-type: http-api

# AI配置使用说明：
# 1. Ollama模式（默认）：
#    - 启动Ollama服务: ollama serve
#    - 拉取模型: ollama pull qwen2:7b
#    - 模型会自动切换到备用模式当Ollama不可用时
#
# 2. OpenAI模式：
#    - 设置环境变量: export OPENAI_API_KEY=your_key_here
#    - 或在配置中直接设置api-key
#
# 3. HTTP API模式（兼容OpenAI API的第三方服务）：
#    - 设置环境变量: 
#      export AI_API_KEY=your_api_key_here
#      export AI_API_URL=https://api.your-service.com/v1
#      export AI_MODEL=your_model_name
#    - 或直接在配置中设置base-url、api-key和model
#
# 4. 禁用AI服务：
#    - 设置: ai.enabled: false
#    - AI服务将返回固定响应

# 知识库配置
knowledge:
  base-path: knowledge-base     # 知识库文件目录（相对于项目根目录）
  init-on-startup: true        # 启动时初始化知识库

# RAG 检索配置
rag:
  max-results: 3                   # 检索结果数量
  min-score: 0.35                  # 最低相似度阈值
