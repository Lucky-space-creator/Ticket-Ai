# ==================== Tomcat 线程池调优（MQ削峰改造后） ====================
# 改造前: Controller同步等待DB写入(50~200ms)，需200线程支撑并发
# 改造后: Controller仅做Redis预扣+MQ入队(<10ms)，线程利用率大幅提升
# 策略: 降低max-threads(单线程吞吐量↑) + 提高accept-count(缓冲突发流量)
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB
    threads:
      max: 200              # 从200降至150（单请求耗时↓80%，同等并发所需线程↓）
      min-spare: 20         # 从10提升至20（保持更多热线程应对突发）
      accept-count: 800      # 从100大幅提升至500（作为流量蓄水池）
    # 连接超时配置
    connection-timeout: 10000   # 10秒连接超时
    keep-alive-timeout: 30s     # 长连接保持30秒（前端轮询需要）
gateway:
  rate-limit-enabled: true
  security-enabled: true

  # 全局限流（保护整个服务不被打垮）
  global-rps: 10000          # 全局每秒最大请求数
  global-window-seconds: 1 # 滑动窗口1秒

  # IP限流（防止单IP攻击）
  ip-rps: 20               # 单IP每秒最大请求
  ip-window-seconds: 1

  # 用户限流（防止刷接口）
  user-rps: 1000             # 单用户每秒最大请求
  user-window-seconds: 1

  # 下单接口专用严格限流（核心业务保护）
  order-per-user-per-minute: 5   # 单IP每分钟最多下单次数
  order-window-seconds: 60       # 窗口60秒

  # IP黑名单
  blacklist-ips: []

  # 特定路径独立限流
  path-limits:
    /api/orders: 5         # 下单接口每用户每秒最多5次
    /api/auth/login: 3     # 登录接口每用户每秒最多3次

  # 严格限制路径（使用默认值的一半）
  strict-paths:
    - /api/orders/**

spring:
  application:
    name: ticket-system
# ==================== Spring Async 线程池调优 ====================
# 改造前: Controller层有重量级DB操作，需大线程池
# 改造后: Controller极轻量，异步任务主要用于AI调用等非关键路径
# 策略: 适当降低线程数，将资源留给MQ Consumer
  task:
    execution:
      pool:
        core-size: 8               # 从16降至8（Controller不再需要大量异步线程）
        max-size: 50               # 从120降至50
        queue-capacity: 500        # 从200提升至500（更深的缓冲）
        keep-alive: 60s
        allow-core-thread-timeout: true
      thread-name-prefix: async-task-
      shutdown:
        await-termination: true
        await-termination-period: 60s
  # ==================== Druid 连接池调优 ====================
# 改造前: Controller同步DB写入占用连接
# 改造后: MQ Consumer异步DB写入成为主要DB客户端
# 策略: 保持max-active不变(总并发未变)，提升min-idle保证热连接
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ticket_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    type: com.alibaba.druid.pool.DruidDataSource  # 指定使用Druid连接池
    druid:
      # 连接池核心配置
      initial-size: 15       # 从10提升至15（Consumer启动时需要更多连接）
      min-idle: 30           # 从10提升至30（保持更多热连接）
      max-active: 250        # 保持不变（总DB并发未变）
      max-wait: 3000         # 从5000降至3000（快速失败，避免阻塞）
      
      # 连接有效性检测
      validation-query: SELECT 1
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000  # 检查空闲连接的间隔（毫秒）
      min-evictable-idle-time-millis: 300000    # 连接最小空闲时间（毫秒）
      # 监控统计配置
      filters: stat,wall        # 启用统计、防火墙过滤器（使用默认日志）
      stat-view-servlet:
        enabled: true           # 启用StatViewServlet
        url-pattern: /druid/*   # 监控页面访问路径
        login-username: admin   # 登录用户名（生产环境需修改）
        login-password: admin   # 登录密码（生产环境需修改）
        reset-enable: false     # 禁用重置按钮
      web-stat-filter:
        enabled: true           # 启用WebStatFilter
        url-pattern: /*         # 监控所有URL
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"  # 排除静态资源
      
      # 防火墙配置（防止SQL注入）
      wall:
        enabled: true
        config:
          delete-allow: false # 禁止删除
          drop-table-allow: false # 禁止删除表

  # Jackson 配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # ==================== Redis 连接池调优（改造后最关键资源） ====================
# 改造后Redis负载大幅增加: 滑动窗口限流 + 库存预扣 + 排队结果缓存
# 策略: 大幅提升连接数和空闲连接，减少连接获取延迟
  data:
    redis:
      # 主从模式配置（一主二从）
      # 主节点负责写操作，从节点负责读操作（负载均衡）
      master:
        host: localhost
        port: 6379
      # 从节点列表（格式: host:port），多个用逗号分隔，例如: localhost:6381,localhost:6382
      slaves: localhost:6380,localhost:6381
      database: 0
      timeout: 10000
      lettuce:
        pool:
          max-active: 128         # 从64提升至128（限流+库存+排队结果都需要Redis）
          max-idle: 64            # 从32提升至64
          min-idle: 20            # 从8提升至20（保持更多热连接）
          max-wait: 3000ms        # 从5秒降至3秒（快速失败）

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ticket.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# JWT 配置
jwt:
  secret: ticket-system-secret-key-2024-please-change-in-production
  expiration: 604800000  # 7天（毫秒）

# 日志配置
logging:
  level:
    com.ticket: debug
    com.ticket.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
  file:
    path: logs
  # 使用自定义logback配置（JSON格式输出给ELK）
  config: classpath:logback-spring.xml

# 全链路追踪配置
trace:
  enabled: true
  header-name: X-Request-ID

# ELK日志采集配置
elk:
  enabled: true
  log-path: C:/Users/LENOVO/OneDrive/桌面/购票智能客服系统/project_20260409_100922/projects/ticket-system/logs
  # Elasticsearch 连接配置（供参考，应用端不直连ES，由Logstash采集）
  elasticsearch:
    host: localhost
    port: 9200
    index-prefix: ticket-system
    ai-index-prefix: ai-chat-trace
  # Logstash 配置信息（部署时需同步修改）
  logstash:
    pipeline-path: D:/ELK/Logstash/logstash-9.3.3/config/pipeline.conf





# 智能客服相关配置

# ChromaDB 向量数据库配置
chroma:
  host: 192.168.48.135
  port: 8000
  collection: ticket_knowledge

# AI模型配置 - 支持Ollama和OpenAI两种模式
ai:
  # 模型类型: ollama, openai, http-api
  model-type: http-api
  
  # 启用/禁用AI服务
  enabled: true
  
  # Ollama配置（当model-type=ollama时使用）
  ollama:
    base-url: http://192.168.48.135:11434
    chat-model: llama3.2:3b # qwen2:1.5b不支持LangChain4j中的Tools注解     # 对话模型
    embedding-model: nomic-embed-text  # 向量化模型
    temperature: 0.7
    timeout: 600    # 超时时间设置为10分钟（600秒），初始加载模型可能需要较长时间

  # HTTP API配置（当model-type=http-api时使用）
  http-api:
    base-url: https://api.cphone.vip/v1
    api-key: ${API_KEY:default-key}
    model: gpt-3.5-turbo
    temperature: 0.7
    timeout: 600    #超时时间设置，初始加载模型
    
  # 备用模式配置
  fallback:
    # 当首选模型失败时是否启用备用模式
    enabled: true
    # 备用模型类型（http-api）
    fallback-type: http-api

# AI配置使用说明：
# 1. Ollama模式（默认）：
#    - 启动Ollama服务: ollama serve
#    - 拉取模型: ollama pull qwen2:7b
#    - 模型会自动切换到备用模式当Ollama不可用时
#
# 2. OpenAI模式：
#    - 设置环境变量: export OPENAI_API_KEY=your_key_here
#    - 或在配置中直接设置api-key
#
# 3. HTTP API模式（兼容OpenAI API的第三方服务）：
#    - 设置环境变量: 
#      export AI_API_KEY=your_api_key_here
#      export AI_API_URL=https://api.your-service.com/v1
#      export AI_MODEL=your_model_name
#    - 或直接在配置中设置base-url、api-key和model
#
# 4. 禁用AI服务：
#    - 设置: ai.enabled: false
#    - AI服务将返回固定响应

# 知识库配置
knowledge:
  base-path: knowledge-base     # 知识库文件目录（相对于项目根目录）
  init-on-startup: true        # 启动时初始化知识库

# RAG 检索配置
rag:
  max-results: 3                   # 检索结果数量
  min-score: 0.35                  # 最低相似度阈值

# ==================== RocketMQ MQ调优（削峰核心组件） ====================
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    test-topic: Test_msg
    group: ticket-system-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 3
    retry-times-when-send-async-failed: 2
    max-message-size: 4194304  # 4MB
    compress-message-body-over: 4096
    access-channel: LOCAL
    vip-channel-enabled: false   # 关闭VIP通道，兼容本地/非VIP环境
  # Consumer配置（通过@RocketMQMessageListener注解配置优先级更高）
  # order-queue-consumer-group 在OrderQueueConsumer中已配置:
  #   consumeMode=CONCURRENTLY, maxReconsumeTimes=3
  # 如需调整Consumer并发线程数，可在注解中修改 consumeThreadMax
  consumer:
    group: ticket-system-consumer-group
  check:
    enabled: true
