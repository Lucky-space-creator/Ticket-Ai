# 客服服务配置
server:
  port: 8085

spring:
  config:
    import: optional:nacos:192.168.48.136:8848

# 日志配置
logging:
  level:
    com.ticket.customer: debug
    com.ticket.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/customer-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# JWT配置
jwt:
  secret: ticket-system-secret-key-2024-please-change-in-production
  expiration: 604800000 # 7天

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:192.168.48.136:9876}
  producer:
    group: customer-service-producer-group
  fail-fast: true

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# 客服自定义配置
ticket:
  customer:
    # WebSocket配置
    # allowed-origins: 允许跨域的源（逗号分隔）。默认留空表示仅同源，禁止使用 "*" 通配开放。
    # 生产环境请配置为实际前端域名，例如: https://cs.example.com,https://www.example.com
    websocket:
      endpoint: /ws
      allowed-origins: ""
      stomp:
        broker: /topic
        destination-prefix: /app
    # 客服工作台配置
    workbench:
      max-concurrent-sessions: 5
      auto-accept-timeout: 30