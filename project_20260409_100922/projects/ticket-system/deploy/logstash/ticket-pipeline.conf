# Filebeat -> Logstash -> Elasticsearch（与 D:\ELK\Logstash\logstash-9.3.3\config\ticket-pipeline.conf 保持一致）
# 启动前设置环境变量 ES_PWD 为 elastic 用户密码，或使用 logstash-keystore add ES_PWD

input {
  beats {
    port => 5044
    host => "127.0.0.1"
  }
}

filter {
  ruby {
    code => "event.set('[@metadata][ingest_timestamp]', Time.now.utc.iso8601)"
  }

  if [host][name] {
    mutate {
      rename => { "[host][name]" => "host_name" }
    }
  }

  mutate {
    remove_field => ["agent", "ecs", "input", "log", "host", "@version"]
  }

  if [fields][logType] == "ai-chat-trace" {
    mutate {
      add_field => { "log_category" => "ai_chat" }
    }
  }
}

output {
  if [fields][logType] == "ai-chat-trace" {
    elasticsearch {
      hosts => ["https://127.0.0.1:9200"]
      user => "elastic"
      password => "${ES_PWD}"
      ssl_enabled => true
      ssl_verification_mode => "none"
      index => "ticket-aichat-%{+yyyy.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["https://127.0.0.1:9200"]
      user => "elastic"
      password => "${ES_PWD}"
      ssl_enabled => true
      ssl_verification_mode => "none"
      index => "ticket-app-%{+yyyy.MM.dd}"
    }
  }
}
