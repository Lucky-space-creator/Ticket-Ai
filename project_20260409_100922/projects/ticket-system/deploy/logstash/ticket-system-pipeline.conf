# ========================================
# Logstash Pipeline 配置 - 购票智能客服系统
# ========================================
input {
  # 全量日志采集
  file {
    path => "C:/Users/LENOVO/OneDrive/桌面/购票智能客服系统/project_20260409_100922/projects/ticket-system/logs/**/ticket-system*.json.log"
    start_position => "end"
    sincedb_path => "D:/ELK/Logstash/sincedb_ticket"   # 改为 Windows 有效路径
    codec => json { charset => "UTF-8" }
    tags => ["ticket-system", "app-log"]
    # 不要删除文件，否则新日志无法继续读取
    # file_completed_action => "delete"   # 注释掉或删除
    discover_interval => 5
  }

  # AI 聊天专用日志采集
  file {
    path => "C:/Users/LENOVO/OneDrive/桌面/购票智能客服系统/project_20260409_100922/projects/ticket-system/logs/**/ai-chat-trace*.json.log"
    start_position => "end"
    sincedb_path => "D:/ELK/Logstash/sincedb_ai_chat"
    codec => json { charset => "UTF-8" }
    tags => ["ticket-system", "ai-chat-trace"]
    # file_completed_action => "delete"
    discover_interval => 5
  }
}

filter {
  # 添加采集时间戳
  ruby {
    code => "event.set('[@metadata][ingest_timestamp]', Time.now.utc.iso8601)"
  }

  # 解析 @timestamp（如果日志中已有 timestamp 字段）
  date {
    match => ["timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ"]
    target => "@timestamp"
    timezone => "Asia/Shanghai"
  }

  # AI 聊天日志增强处理
  if "ai-chat-trace" in [tags] {
    # 提取 AiChatTrace 日志中的 trace_data 字段
    grok {
      match => { "message" => "\[AiChatTrace\]\s+%{GREEDYDATA:trace_data}" }
    }

    # 将 trace_data 中的 JSON 解析到 [ai_trace]
    json {
      source => "trace_data"
      target => "[ai_trace]"
      skip_on_invalid_json => true
    }

    # 删除原始 trace_data 字段（可选）
    mutate {
      remove_field => ["trace_data"]
    }

    # 添加 AI 专用标签
    mutate {
      add_field => { "log_category" => "ai_chat" }
    }
  }

  # 通用字段清理和标准化
  mutate {
    remove_field => ["@version", "host", "file"]
    rename => { "logger_name" => "logger" }
    rename => { "thread_name" => "thread" }
    # 如果 JSON 中已经有 traceId 字段（通过 MDC 包含），会自动保留
  }
}

output {
  if "ai-chat-trace" in [tags] {
    elasticsearch {
      hosts => ["https://localhost:9200"]
      user => "elastic"
      password => "123456"
      index => "ai-chat-trace-%{+yyyy.MM.dd}"
      ssl_enabled => true
      ssl_verification_mode => "none"
    }
  } else {
    elasticsearch {
      hosts => ["https://localhost:9200"]
      user => "elastic"
      password => "123456"
      index => "ticket-system-%{+yyyy.MM.dd}"
      ssl_enabled => true
      ssl_verification_mode => "none"
    }
  }
}