# ========================================
# Logstash Pipeline 配置 - 购票智能客服系统
# ========================================
#
# 使用说明：
#   1. 将此文件放到 Logstash 的 pipeline 目录 (通常为 /etc/logstash/conf.d/)
#   2. 根据实际环境修改以下路径和连接信息：
#      - file path → 应用日志文件路径
#      - hosts     → Elasticsearch 地址
#   3. 启动/重启 Logstash 服务
#
# 数据流：Application JSON Log File → Logstash (parse+enrich) → Elasticsearch → Kibana
#

input {
  # 全量日志采集（ticket-system.json.log）
  file {
    path => "/path/to/ticket-system/logs/ticket-system*.json.log"
    start_position => "end"
    sincedb_path => "/var/lib/logstash/sincedb_ticket"
    codec => json { charset => "UTF-8" }
    tags => ["ticket-system", "app-log"]
    # 避免重复读取
    file_completed_action => "delete"
    file_interval => 5
    discover_interval => 5
  }

  # AI聊天专用日志采集（ai-chat-trace.json.log）
  file {
    path => "/path/to/ticket-system/logs/ai-chat-trace*.json.log"
    start_position => "end"
    sincedb_path => "/var/lib/logstash/sincedb_ai_chat"
    codec => json { charset => "UTF-8" }
    tags => ["ticket-system", "ai-chat-trace"]
    file_completed_action => "delete"
    file_interval => 5
    discover_interval => 5
  }
}

filter {
  # 统一添加采集时间戳
  ruby {
    code => "event.set('[@metadata][ingest_timestamp]', Time.now.utc.iso8601)"
  }

  # 解析 @timestamp 为标准格式
  date {
    match => ["timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ"]
    target => "@timestamp"
    timezone => "Asia/Shanghai"
  }

  # AI聊天日志增强处理
  if "ai-chat-trace" in [tags] {
    # 提取 AiChatTrace 日志中的结构化字段
    grok {
      match => {
        "message" => "\[AiChatTrace\]\s+%{GREEDYDATA:trace_data}"
      }

      # 解析 trace_data 中的JSON
      json {
        source => "trace_data"
        target => "[ai_trace]"
        skip_on_invalid_json => true
      } overwrite => ["trace_data"]
    }

    # 添加AI专用标签
    mutate {
      add_field => { "log_category" => "ai_chat" }
    }
  }

  # 通用字段清理和标准化
  mutate {
    # 移除无意义字段
    remove_field => ["@version", "host", "file"]

    # 字段重命名（统一命名规范）
    rename => { "logger_name" => "logger" }
    rename => { "thread_name" => "thread" }

    # 将 MDC 嵌套字段提升到顶层
    # traceId 已通过 includeMdcKeyName 包含在JSON中
  }

  # 用户脱敏处理（可选，生产环境建议启用）
  # 如果日志中包含手机号、身份证等敏感信息，可在此处进行脱敏
}

output {
  # 主输出：Elasticsearch
  elasticsearch {
    hosts => ["http://localhost:9200"]

    # 根据日志类型写入不同索引
    if "ai-chat-trace" in [tags] {
      index => "ai-chat-trace-%{+yyyy.MM.dd}"
    } else {
      index => "ticket-system-%{+yyyy.MM.dd}"
    }

    # 模板管理
    manage_template => true
    template_name => "ticket-system"
    template_overwrite => true

    # 性能调优
    bulk_max_size => 500
    idle_flush_time => 3

    # 认证（如ES开启了安全认证）
    # user => "logstash"
    # password => "${ES_LOGSTASH_PASSWORD}"

    ssl_certificate_verification => false
  }

  # 调试输出（开发环境可用，生产环境注释掉）
  # stdout { codec => rubydebug }
}
