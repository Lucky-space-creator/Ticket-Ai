# 本地默认配置（当Nacos配置缺失时使用）
server:
  port: 8083

spring:
  config:
    import: optional:nacos:localhost:8848
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 10000
          train-service:
            connectTimeout: 3000
            readTimeout: 12000

# 与网关、用户服务保持一致（JWT 解析）
jwt:
  secret: ticket-system-secret-key-2024-please-change-in-production

# RocketMQ：与 docker-compose 中 namesrv 端口 9876 一致；Nacos 的 sharding-rocketmq-config.yaml 可覆盖
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: order-service-producer-group
  fail-fast: true

# 日志配置
logging:
  level:
    com.ticket.order: debug
    com.ticket.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always