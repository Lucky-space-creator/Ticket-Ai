# 本地默认配置（当Nacos配置缺失时使用）
# ==================== Tomcat 线程池调优 ====================
# 下单接口为两段式异步：Controller 仅做 Redis 预扣 + MQ 入队（约 12~30ms）
# max-threads 决定阶段1 的最大并发连接数；accept-count 作为突发流量蓄水池
server:
  port: 8083
  tomcat:
    threads:
      max: 200              # 阶段1 最大并发 = 200 连接
      min-spare: 20         # 保持热线程应对突发流量
    accept-count: 800       # 超出线程数的请求排队缓冲，避免直接拒绝
    max-connections: 10000
    connection-timeout: 10000
    keep-alive-timeout: 30s # 前端轮询排队结果需要长连接

spring:
  config:
    import: optional:nacos:192.168.48.136:8848
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 10000
          train-service:
            connectTimeout: 3000
            readTimeout: 12000

  # ==================== Druid 连接池调优 ====================
  # 阶段2（OrderQueueConsumer 异步落库）是主要 DB 客户端
  # 单条消费约 15~40ms，max-active 直接决定落单 QPS 上限
  # 落单能力 ≈ max-active / 单条耗时 = 200 / 0.03 ≈ 6600 单/s（受 MySQL 实际写入能力约束）
  datasource:
    druid:
      initial-size: 20      # 启动即预热连接，避免 Consumer 冷启动抖动
      min-idle: 30          # 保持热连接，减少建连开销
      max-active: 200       # 落单能力核心参数（原默认远低于此值）
      max-wait: 3000        # 快速失败，避免线程长时间阻塞在取连接上
      validation-query: SELECT 1
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      keep-alive: true
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

  # ==================== Redis 连接池调优 ====================
  # 幂等键、库存预扣结果、排队结果轮询均走 Redis，连接池不足会成为阶段1 瓶颈
  data:
    redis:
      lettuce:
        pool:
          max-active: 128
          max-idle: 64
          min-idle: 20
          max-wait: 3000ms

# 与网关、用户服务保持一致（JWT 解析）
jwt:
  secret: ticket-system-secret-key-2024-please-change-in-production

# ==================== 未支付订单超时取消 ====================
# 必须在 train-service 预占 TTL(30min) 之前触发，否则 Redis 预占已被删除，回滚会误加回 stock 造成超卖
order:
  pay-timeout-minutes: 15        # 待支付订单存活时长（分钟）
  timeout-cancel-cron: "0 * * * * ?"  # 每分钟扫描一次（多实例靠乐观抢占互斥）

# ==================== 熔断降级（order-service -> train-service 同步 Feign） ====================
# 仅保护入队路径的查价/预扣；超时快速失败，避免 Hold 住 Tomcat 线程拖垮下单入口
resilience4j:
  circuitbreaker:
    instances:
      trainService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10          # 最近 10 次调用统计
        failure-rate-threshold: 50       # 失败率 > 50% 打开熔断
        wait-duration-in-open-state: 10s # 打开 10s 后半开试探
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      trainService:
        timeout-duration: 3s             # 3s 超时即失败（替代 10s Feign readTimeout 的快速失败）
        cancel-running-future: true

# RocketMQ：与 docker-compose 中 namesrv 端口 9876 一致；Nacos 的 sharding-rocketmq-config.yaml 可覆盖
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:192.168.48.136:9876}
  producer:
    group: order-service-producer-group
  fail-fast: true

# 日志配置
logging:
  level:
    com.ticket.order: debug
    com.ticket.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ticket.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always