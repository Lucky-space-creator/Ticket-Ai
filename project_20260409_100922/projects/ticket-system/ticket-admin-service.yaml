# 管理服务专用配置
# AI配置（管理服务不需要AI，但需提供默认值避免启动失败）
ai:
  enabled: false
  model-type: disabled
  fallback:
    enabled: false
    fallback-type: ollama
  ollama:
    base-url: http://localhost:11434
    chat-model: llama2
    embedding-model: nomic-embed-text
    temperature: 0.7
    timeout: 60
  http-api:
    base-url: https://api.openai.com/v1
    api-key: dummy-key
    model: gpt-3.5-turbo
    temperature: 0.7
    timeout: 30

# RAG配置
rag:
  max-results: 5
  min-score: 0.6

# ChromaDB配置（管理服务不需要，但需提供默认值）
chroma:
  host: localhost
  port: 8000
  collection: ticket_knowledge

# RocketMQ配置（管理服务不需要，禁用）
rocketmq:
  enabled: false
  detect-enabled: false