# 本地默认配置（Nacos 配置优先）
# 限流/鉴权/路由限流参数均由 Nacos gateway.* 统一管理
server:
  port: 8080

# JWT 密钥：必须由 Nacos 配置中心提供
# jwt.secret=

spring:
  config:
    import: optional:nacos:sharding-gateway-config.yaml
  cloud:
    gateway:
      routes:
        # 登录/注册（匿名放行）
        - id: user-service-auth-public
          uri: lb://user-service
          order: -10
          predicates:
            - Path=/api/auth/login,/api/auth/register

        # 用户服务
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**,/api/passengers/**

        # 车次服务路由
        - id: train-service
          uri: lb://train-service
          predicates:
            - Path=/api/trains/**,/api/ticket-stocks/**

        # 下单排队轮询：高频只读
        - id: order-service-queue-read
          uri: lb://order-service
          order: -10
          predicates:
            - Path=/api/orders/queue/**

        # 订单服务路由
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**

        # AI聊天服务路由
        - id: aichat-service
          uri: lb://aichat-service
          predicates:
            - Path=/api/chat/**,/api/knowledge/**

        # 客服服务路由（REST）
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/customer-service/**

        # 客服 WebSocket
        - id: customer-service-ws
          uri: lb://customer-service
          predicates:
            - Path=/ws/**

        # 管理端登录（匿名放行）
        - id: admin-service-auth-public
          uri: lb://admin-service
          order: -10
          predicates:
            - Path=/api/admin/auth/login

        # 管理服务路由
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/admin/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
        - AddResponseHeader=X-Gateway-Version, ticket-gateway-1.0

      discovery:
        locator:
          enabled: false
          lower-case-service-id: true

logging:
  level:
    com.ticket.gateway: INFO
    org.springframework.cloud.gateway: INFO
    com.alibaba.cloud.nacos: WARN
    com.alibaba.nacos.client.naming: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
