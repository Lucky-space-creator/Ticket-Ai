# Spring Cloud Bootstrap 配置（优先加载）
spring:
  application:
    name: ticket-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: 
        group: DEFAULT_GROUP
        cluster-name: DEFAULT
        register-enabled: true
      config:
        server-addr: localhost:8848
        namespace: 
        group: DEFAULT_GROUP
        file-extension: yaml
        import-check:
          enabled: false
        shared-configs:
          - data-id: sharding-redis-config.yaml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: sharding-gateway-config.yaml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: sharding-database-config.yaml
            group: DEFAULT_GROUP
            refresh: true
  profiles:
    active: dev