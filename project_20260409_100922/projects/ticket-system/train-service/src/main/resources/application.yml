# 本地默认配置（当Nacos配置缺失时使用）
server:
  port: 8082

# 日志配置
logging:
  level:
    com.ticket.train: debug
    com.ticket.mapper: debug
    com.alibaba.cloud.nacos: DEBUG
    com.alibaba.nacos.client.naming: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always