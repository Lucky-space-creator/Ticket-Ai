# Spring Cloud Bootstrap 配置（优先加载）
spring:
  application:
    name: train-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        cluster-name: ${NACOS_CLUSTER_NAME:DEFAULT}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        shared-configs:
          - data-id: ticket-common.yaml
            group: DEFAULT_GROUP
            refresh: true
        extension-configs:
          - data-id: ticket-train-service.yaml
            group: DEFAULT_GROUP
            refresh: true
  profiles:
    active: ${PROFILE_ACTIVE:dev}