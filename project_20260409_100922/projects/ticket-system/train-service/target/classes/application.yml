# 本地默认配置（当Nacos配置缺失时使用）
server:
  port: 8082

# 联程路径搜索（写死为可配置，便于压测与联调）
train:
  route-search:
    min-transfer-minutes: 20
    max-legs: 4
    max-results: 25
    max-bfs-expand: 100   #bfs
    timeout-ms: 800   #超时

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: train-service-producer-group
  fail-fast: true

# 日志配置
logging:
  level:
    com.ticket.train: debug
    com.ticket.mapper: debug
    com.alibaba.cloud.nacos: WARN
    com.alibaba.nacos.client.naming: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always