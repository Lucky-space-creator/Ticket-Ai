# 本地默认配置（当Nacos配置缺失时使用）
server:
  port: 8089

# RocketMQ：ticket-common 扫描到 RocketMQProducerService 需 RocketMQTemplate；Nacos 的 sharding-rocketmq-config.yaml 可覆盖
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: user-service-producer-group
  fail-fast: true

# JWT配置
jwt:
  secret: ticket-system-secret-key-2024-please-change-in-production
  expiration: 604800000

# 日志配置
logging:
  level:
    com.ticket.user: debug
    com.ticket.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always